          mkdir -p $(dirname 'app/src/main/java/com/tindahan/inventory/InventoryViewModel.kt')
          cat > 'app/src/main/java/com/tindahan/inventory/InventoryViewModel.kt' <<'EOF_2'
          package com.tindahan.inventory

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.tindahan.inventory.data.*
          import kotlinx.coroutines.ExperimentalCoroutinesApi
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch

          private data class Filters(val q: String, val cat: Long?, val newest: Boolean, val archived: Boolean)

          @OptIn(ExperimentalCoroutinesApi::class)
          class InventoryViewModel(app: Application) : AndroidViewModel(app) {
              private val dao = AppDb.get(app).dao()

              val query = MutableStateFlow("")
              val categoryFilter = MutableStateFlow<Long?>(null)
              val newestFirst = MutableStateFlow(true)
              val showArchived = MutableStateFlow(false)

              val categories: StateFlow<List<Category>> = dao.categories()
                  .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())

              val products: StateFlow<List<ProductItem>> =
                  combine(query, categoryFilter, newestFirst, showArchived) { q, c, n, a -> Filters(q.trim(), c, n, a) }
                      .flatMapLatest { f -> dao.search(f.q, f.cat, f.archived, if (f.newest) -1 else 1) }
                      .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())

              /** Create (existing == null) or Update a product. A non-blank newCategory creates a category. */
              fun save(existing: Product?, name: String, price: Double, stock: Int, categoryId: Long?, newCategory: String) {
                  viewModelScope.launch {
                      var catId = categoryId
                      val nc = newCategory.trim()
                      if (nc.isNotEmpty()) {
                          dao.insertCategory(Category(name = nc))
                          catId = dao.categoryIdByName(nc)
                      }
                      if (existing == null) {
                          dao.insertProduct(Product(name = name.trim(), categoryId = catId, price = price, stock = stock))
                      } else {
                          dao.updateProduct(existing.copy(name = name.trim(), categoryId = catId, price = price, stock = stock))
                      }
                  }
              }

              fun setArchived(id: Long, archived: Boolean) {
                  viewModelScope.launch { dao.setArchived(id, archived) }
              }
          }
          EOF_2
          mkdir -p $(dirname 'app/src/main/java/com/tindahan/inventory/MainActivity.kt')
          cat > 'app/src/main/java/com/tindahan/inventory/MainActivity.kt' <<'EOF_3'
          package com.tindahan.inventory

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.tindahan.inventory.data.Category
          import com.tindahan.inventory.data.ProductItem

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = lightColorScheme(primary = Color(0xFF2E7D32))) {
                          InventoryScreen()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun InventoryScreen(vm: InventoryViewModel = viewModel()) {
              val products by vm.products.collectAsStateWithLifecycle()
              val categories by vm.categories.collectAsStateWithLifecycle()
              val query by vm.query.collectAsStateWithLifecycle()
              val catFilter by vm.categoryFilter.collectAsStateWithLifecycle()
              val newest by vm.newestFirst.collectAsStateWithLifecycle()
              val archived by vm.showArchived.collectAsStateWithLifecycle()

              var showForm by remember { mutableStateOf(false) }
              var editing by remember { mutableStateOf<ProductItem?>(null) }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text(if (archived) "Archived" else "My Tindahan") },
                          actions = {
                              IconButton(onClick = { vm.newestFirst.value = !newest }) {
                                  Icon(
                                      if (newest) Icons.Default.ArrowDownward else Icons.Default.ArrowUpward,
                                      contentDescription = "Sort"
                                  )
                              }
                              IconButton(onClick = { vm.showArchived.value = !archived }) {
                                  Icon(
                                      if (archived) Icons.Default.Inventory2 else Icons.Default.Archive,
                                      contentDescription = "Toggle archived"
                                  )
                              }
                          }
                      )
                  },
                  floatingActionButton = {
                      if (!archived) {
                          ExtendedFloatingActionButton(
                              onClick = { editing = null; showForm = true },
                              icon = { Icon(Icons.Default.Add, null) },
                              text = { Text("Add product") }
                          )
                      }
                  }
              ) { padding ->
                  Column(Modifier.padding(padding)) {
                      OutlinedTextField(
                          value = query,
                          onValueChange = { vm.query.value = it },
                          placeholder = { Text("Search products") },
                          leadingIcon = { Icon(Icons.Default.Search, null) },
                          trailingIcon = {
                              if (query.isNotEmpty()) IconButton(onClick = { vm.query.value = "" }) {
                                  Icon(Icons.Default.Close, "Clear")
                              }
                          },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp)
                      )
                      LazyRow(
                          contentPadding = PaddingValues(horizontal = 16.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          item {
                              FilterChip(selected = catFilter == null, onClick = { vm.categoryFilter.value = null }, label = { Text("All") })
                          }
                          items(categories, key = { it.id }) { c ->
                              FilterChip(
                                  selected = catFilter == c.id,
                                  onClick = { vm.categoryFilter.value = if (catFilter == c.id) null else c.id },
                                  label = { Text(c.name) }
                              )
                          }
                      }
                      Text(
                          (if (newest) "Latest to oldest" else "Oldest to latest") + " • ${products.size} item(s)",
                          style = MaterialTheme.typography.labelMedium,
                          modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)
                      )

                      if (products.isEmpty()) {
                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text(
                                  if (archived) "No archived products" else "No products yet.\nTap “Add product” to start.",
                                  color = Color.Gray
                              )
                          }
                      } else {
                          LazyColumn(
                              contentPadding = PaddingValues(start = 16.dp, end = 16.dp, bottom = 96.dp),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              items(products, key = { it.product.id }) { item ->
                                  ProductCard(
                                      item = item,
                                      onEdit = { editing = item; showForm = true },
                                      onArchiveToggle = { vm.setArchived(item.product.id, !item.product.archived) }
                                  )
                              }
                          }
                      }
                  }
              }

              if (showForm) {
                  ProductFormDialog(
                      existing = editing,
                      categories = categories,
                      onDismiss = { showForm = false },
                      onSave = { name, price, stock, catId, newCat ->
                          vm.save(editing?.product, name, price, stock, catId, newCat)
                          showForm = false
                      }
                  )
              }
          }

          @Composable
          fun ProductCard(item: ProductItem, onEdit: () -> Unit, onArchiveToggle: () -> Unit) {
              val p = item.product
              Card(Modifier.fillMaxWidth()) {
                  Row(Modifier.padding(start = 16.dp, top = 8.dp, bottom = 8.dp, end = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text(p.name, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                          Text(item.categoryName ?: "Uncategorized", style = MaterialTheme.typography.bodySmall, color = Color.Gray)
                          Spacer(Modifier.height(4.dp))
                          Text("₱%.2f  •  Stock: %d".format(p.price, p.stock), style = MaterialTheme.typography.bodyMedium)
                      }
                      if (!p.archived) {
                          IconButton(onClick = onEdit) { Icon(Icons.Default.Edit, "Edit") }
                          IconButton(onClick = onArchiveToggle) { Icon(Icons.Default.Archive, "Archive") }
                      } else {
                          IconButton(onClick = onArchiveToggle) { Icon(Icons.Default.Unarchive, "Restore") }
                      }
                  }
              }
          }

          @Composable
          fun ProductFormDialog(
              existing: ProductItem?,
              categories: List<Category>,
              onDismiss: () -> Unit,
              onSave: (String, Double, Int, Long?, String) -> Unit
          ) {
              val p = existing?.product
              var name by remember { mutableStateOf(p?.name ?: "") }
              var price by remember { mutableStateOf(p?.price?.toString() ?: "") }
              var stock by remember { mutableStateOf(p?.stock?.toString() ?: "") }
              var catId by remember { mutableStateOf(p?.categoryId) }
              var newCat by remember { mutableStateOf("") }
              var addingCat by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf<String?>(null) }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(if (p == null) "Add product" else "Edit product") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(name, { name = it }, label = { Text("Product name") }, singleLine = true)
                          OutlinedTextField(
                              price, { price = it }, label = { Text("Price (₱)") }, singleLine = true,
                              keyboardOptions = androidx.compose.foundation.text.KeyboardOptions(keyboardType = KeyboardType.Decimal)
                          )
                          OutlinedTextField(
                              stock, { stock = it }, label = { Text("Stock quantity") }, singleLine = true,
                              keyboardOptions = androidx.compose.foundation.text.KeyboardOptions(keyboardType = KeyboardType.Number)
                          )
                          Text("Category", style = MaterialTheme.typography.labelLarge)
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(categories, key = { it.id }) { c ->
                                  FilterChip(
                                      selected = catId == c.id && !addingCat,
                                      onClick = { catId = c.id; addingCat = false; newCat = "" },
                                      label = { Text(c.name) }
                                  )
                              }
                              item {
                                  AssistChip(
                                      onClick = { addingCat = true },
                                      label = { Text("New") },
                                      leadingIcon = { Icon(Icons.Default.Add, null, Modifier.size(18.dp)) }
                                  )
                              }
                          }
                          if (addingCat) {
                              OutlinedTextField(newCat, { newCat = it }, label = { Text("New category name") }, singleLine = true)
                          }
                          error?.let { Text(it, color = MaterialTheme.colorScheme.error) }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val pr = price.toDoubleOrNull()
                          val st = stock.ifBlank { "0" }.toIntOrNull()
                          when {
                              name.isBlank() -> error = "Enter a product name"
                              pr == null || pr < 0 -> error = "Enter a valid price"
                              st == null || st < 0 -> error = "Enter a valid stock"
                              else -> onSave(name, pr, st, catId, if (addingCat) newCat else "")
                          }
                      }) { Text("Save") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } }
              )
          }
          EOF_3
          mkdir -p $(dirname 'app/src/main/java/com/tindahan/inventory/data/Db.kt')
          cat > 'app/src/main/java/com/tindahan/inventory/data/Db.kt' <<'EOF_4'
          package com.tindahan.inventory.data

          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Entity(tableName = "categories", indices = [Index(value = ["name"], unique = true)])
          data class Category(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String
          )

          @Entity(tableName = "products")
          data class Product(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val categoryId: Long?,
              val price: Double,
              val stock: Int,
              val archived: Boolean = false,
              val createdAt: Long = System.currentTimeMillis()
          )

          data class ProductItem(
              @Embedded val p
