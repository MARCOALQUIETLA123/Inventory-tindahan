          }

          android {
              namespace = "com.tindahan.inventory"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.tindahan.inventory"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
